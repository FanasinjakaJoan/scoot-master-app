# Scoot Master — Blueprint Render (Infrastructure as Code)
# Documentation complète : docs/RENDER.md
#
# CHOIX D'ARCHITECTURE : Web Service (type: web)
# -------------------------------------------------
# On choisit 2 Web Services (et non Private Service) pour les raisons suivantes :
#   - scoot-master-api doit être accessible publiquement :
#     * App mobile native Expo Go appelle l'API directement (pas via le proxy web)
#     * Tests curl/Postman, intégrations externes
#     * Dashboard Render fournit une URL publique https://*.onrender.com + certificat auto
#   - scoot-master-web doit être public pour les utilisateurs finaux (navigateur PC/mobile)
#   - Les 2 services communiquent quand même en réseau privé interne (gratuit, <2ms)
#     via fromService: hostport (scoot-master-api:10000) → pas de latence publique pour /api
#   - Alternative Private Service (type: pserv) : uniquement si vous voulez que l'API
#     soit 100% interne et jamais accessible depuis l'extérieur. Dans ce cas, seule l'app web
#     fonctionnerait, pas l'app mobile native. Ce n'est PAS notre choix ici.
#
# Architecture retenue :
#   - scoot-master-api : Web Service Docker + disque persistant 1GB (SQLite)
#   - scoot-master-web : Web Service Docker (build Expo web statique) + proxy /api → API en privé
#
# Déploiement :
#   1. Fork/clone ce dépôt sur GitHub
#   2. Sur https://dashboard.render.com → New + → Blueprint → sélectionner le dépôt
#   3. Render détecte ce render.yaml et crée les 2 Web Services
#   4. JWT_SECRET est auto-généré, SEED_ON_START=true crée admin/vendeur + démos
#   5. URLs publiques : https://scoot-master-api.onrender.com et https://scoot-master-web.onrender.com
#
# Notes Render spécifiques Web Service :
#   - Chaque Web Service DOIT écouter sur $PORT (Render injecte 10000 par défaut)
#   - healthCheckPath est vérifié par Render sur ce $PORT (doit répondre 200)
#   - Le disque persistant nécessite plan Starter minimum (Free ne supporte pas les disks)
#   - EXPO_PUBLIC_API_URL="" (vide) dans mobile/Dockerfile ⇒ app web appelle /api en relatif,
#     le serveur web (deploy/web-server.js) relaie vers l'API — pas de CORS, HTTPS transparent.

services:
  # -------------------------------------------------------------------------
  # API — Web Service (choix explicite, pas Private Service)
  # -------------------------------------------------------------------------
  # Pourquoi Web Service ?
  #   - Besoin d'URL publique pour l'app mobile native (Expo Go) qui ne passe pas par le proxy web
  #   - Besoin d'accès direct pour tests, exports, sauvegardes, monitoring
  #   - Peut quand même être joint en privé par le web via hostport interne (scoot-master-api:10000)
  #   - Si on voulait 100% privé, on mettrait type: pserv + pas d'URL publique, mais on perdrait mobile natif
  - type: web
    name: scoot-master-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # requis pour les disks persistants (Free ne supporte pas les disks)
    healthCheckPath: /api/health
    # autoDeploy: true par défaut — chaque push sur main redéploie
    envVars:
      - key: NODE_ENV
        value: production
      # Render injecte PORT=10000 automatiquement. backend/src/config.js lit process.env.PORT
      - key: JWT_SECRET
        generateValue: true # Render génère une chaîne aléatoire sécurisée
        # Généré UNE SEULE FOIS au premier déploiement puis conservé : les
        # sessions survivent aux redéploiements. Ne le régénérez pas à la main,
        # cela déconnecterait tous les utilisateurs.
      # Session longue : l'utilisateur reste connecté jusqu'à SA déconnexion.
      # L'app renouvelle le jeton en arrière-plan (POST /api/auth/refresh).
      - key: JWT_TTL
        value: "30d"
      # Un jeton expiré depuis moins de 60 j reste renouvelable : un appareil
      # resté hors ligne retrouve sa session au lieu d'être déconnecté.
      - key: JWT_REFRESH_GRACE
        value: "60d"
      - key: SEED_ON_START
        value: "true" # idempotent : ne sème que si la base est vide (admin/admin123, vendeur/vendeur123)
      - key: CORS_ORIGIN
        value: "*" # en prod, remplacez par https://scoot-master-web.onrender.com
      - key: DB_PATH
        value: /app/data/scoot.db # chemin sur le disque persistant
    disk:
      name: scoot-master-data
      mountPath: /app/data # correspond à DB_PATH parent
      sizeGB: 1 # minimum facturable, suffisant pour SQLite (quelques Go de motos/ventes)

  # -------------------------------------------------------------------------
  # WEB — Web Service (choix explicite, public, stateless)
  # -------------------------------------------------------------------------
  # Pourquoi Web Service ?
  #   - Doit être accessible publiquement par les navigateurs (PC + mobile)
  #   - Sert le build Expo web (dist) + proxy /api vers l'API en réseau privé
  #   - Stateless, peut scaler horizontalement (numInstances: 2 si besoin)
  - type: web
    name: scoot-master-web
    runtime: docker
    dockerfilePath: ./mobile/Dockerfile
    dockerContext: . # contexte racine car Dockerfile copie deploy/web-server.js
    plan: starter # ou free pour économiser, mais starter recommandé pour perf build Expo
    healthCheckPath: / # le serveur web sert index.html
    envVars:
      # Réseau privé Render : on injecte automatiquement host:port de l'API Web Service
      # Exemple résolu : scoot-master-api:10000
      # deploy/web-server.js normalise en http://scoot-master-api:10000
      - key: API_TARGET
        fromService:
          type: web # on référence bien un Web Service (pas pserv)
          name: scoot-master-api
          property: hostport
      # Optionnel hardcodé (moins robuste) :
      # - key: API_TARGET
      #   value: http://scoot-master-api:10000
