name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: 🧪 Tests backend (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-smoke:
    name: 💨 Smoke test backend (démarrage + /api/health)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Démarrer le serveur et vérifier la santé
        run: |
          node src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/api/health; then OK=1; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4000/api/health
          TOKEN=$(curl -sf -X POST http://127.0.0.1:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token))")
          test -n "$TOKEN" && echo "::notice::Login démo OK"
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:4000/api/bikes?limit=1 >/dev/null
          kill $SERVER_PID

  mobile-tests:
    name: 🧪 Tests mobile (Jest) + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Vérification TypeScript
        run: npx tsc --noEmit
      - name: Tests unitaires
        run: npx jest --ci
      # Le bundle natif est vérifié ICI, pas seulement dans le workflow APK :
      # un import non résoluble par Metro (ex. `require('buffer')`) casse le build
      # Android après ~10 min de Gradle. Cette étape échoue en quelques secondes.
      - name: Bundle natif Android (expo export — détecte les imports non résolubles)
        run: npx expo export --platform android --output-dir /tmp/android-bundle
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

  web-render:
    name: 💨 Rendu de l'app web (build + smoke test en DOM simulé)
    runs-on: ubuntu-latest
    needs: [mobile-tests]
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
      - name: Dépendances (app + API de démo)
        run: |
          npm ci
          (cd ../backend && npm ci)
      - name: Build web (expo export — détecte imports et assets cassés)
        run: npm run build:web
      - name: API + serveur web, puis vérification du rendu réel
        run: |
          SEED_ON_START=true node ../backend/src/server.js > /tmp/api.log 2>&1 &
          API_PID=$!
          PORT=8080 WEB_ROOT=mobile/dist node ../deploy/web-server.js > /tmp/web.log 2>&1 &
          WEB_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/health >/dev/null && \
              curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          status=0
          # 1) l'écran de connexion doit se rendre sans erreur runtime
          node scripts/web-smoke.mjs || status=1
          # 2) connexion + sync + accueil + navigation + écriture de formulaire
          node scripts/web-smoke.mjs --login admin admin123 --write --wait 40000 || status=1
          # 3) session périmée (jeton refusé par le serveur) : validée AVANT tout
          #    appel métier via /api/auth/check (toujours 200, ZÉRO 401) puis connexion
          node scripts/web-smoke.mjs --stale-session || status=1
          kill $API_PID $WEB_PID 2>/dev/null || true
          exit $status
      - name: Journaux des serveurs (si échec)
        if: failure()
        run: cat /tmp/api.log /tmp/web.log

  docker-build:
    name: 🐳 Build des images Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, mobile-tests, web-render]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: scoot-master-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Image Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mobile/Dockerfile
          push: false
          tags: scoot-master-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
