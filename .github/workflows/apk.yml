name: 📱 Build APK Android

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/apk.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (preview, production, local)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
          - local
      api_url:
        description: "URL de l'API (EXPO_PUBLIC_API_URL)"
        required: false
        default: "https://scoot-master-api.onrender.com"
        type: string

jobs:
  build-apk-gradle:
    name: 🤖 Build APK (Gradle local, sans EAS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17 (pour Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (preinstallé sur ubuntu-latest)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || ls -la /usr/local/lib/android/sdk || echo "SDK not in default path"
          sdkmanager --version || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version || echo "sdkmanager check"
          # Accepter les licences
          yes | sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || echo "licenses accepted or no sdkmanager"

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (génère dossier android/)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://scoot-master-api.onrender.com' }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK Release avec Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://scoot-master-api.onrender.com' }}

      - name: Renommer APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK trouvé: $APK_PATH"
          ls -lh android/app/build/outputs/apk/release/
          cp "$APK_PATH" scoot-master-${{ github.sha }}.apk
          cp "$APK_PATH" scoot-master-latest.apk
          ls -lh *.apk

      - name: Upload APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: scoot-master-apk
          path: |
            mobile/scoot-master-*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK vers transfer.sh (lien public temporaire)
        if: always()
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Upload $APK_PATH vers transfer.sh..."
          # transfer.sh fournit un lien direct téléchargeable (14 jours)
          curl --upload-file "$APK_PATH" https://transfer.sh/scoot-master-latest.apk --no-progress-meter | tee /tmp/transfer_url.txt
          echo "TRANSFER_URL=$(cat /tmp/transfer_url.txt)" >> $GITHUB_ENV
          echo "Lien transfer.sh : $(cat /tmp/transfer_url.txt)"

      - name: Créer Release GitHub avec APK (si tag ou workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.sha }}
          name: "APK Scoot Master - ${{ github.sha }}"
          body: |
            📱 APK Android généré automatiquement

            - Package: mg.scootmaster.app
            - Version: ${{ fromJSON(steps.version.outputs.version || '{}').version || '1.0.0' }}
            - API URL: ${{ inputs.api_url || 'https://scoot-master-api.onrender.com' }}
            - Commit: ${{ github.sha }}
            - Lien transfer.sh: ${{ env.TRANSFER_URL }}

            Installation : `adb install scoot-master-latest.apk` ou transfert sur téléphone.
          files: |
            mobile/scoot-master-latest.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      - name: Résumé
        run: |
          echo "### 📱 APK généré avec succès !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: mg.scootmaster.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $(jq -r .expo.version app.json)" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ inputs.api_url || 'https://scoot-master-api.onrender.com' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Transfer.sh**: ${{ env.TRANSFER_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Téléchargez l'APK dans l'onglet **Artifacts** de ce workflow ou via le lien transfer.sh." >> $GITHUB_STEP_SUMMARY

  # Optionnel : Build via EAS (nécessite EXPO_TOKEN en secret)
  build-apk-eas:
    name: ☁️ Build APK (EAS Cloud, optionnel)
    runs-on: ubuntu-latest
    if: ${{ false }} # Désactivé par défaut, activez en mettant true ou en ajoutant un secret EXPO_TOKEN
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: EAS Build APK (preview)
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --no-wait
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://scoot-master-api.onrender.com' }}
